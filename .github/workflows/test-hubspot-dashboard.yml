name: Test HubSpot reporting (offline)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install minimal dependencies
        run: python -m pip install requests Flask python-dotenv
      - name: Test read-only HubSpot reporting without credentials
        working-directory: ai-content-pipeline
        run: python -m unittest discover -s tests -p test_hubspot_reporting.py -v
